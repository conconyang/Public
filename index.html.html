<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>時間記錄</title>
<style>
:root{--bg:#eef1f6;--card:#ffffff;--tx:#18202f;--mu:#667085;--bd:#dde2ec;--study:#2f5bea;--fun:#d6336c;--other:#12926b;--soft:#f5f7fb;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f131b;--card:#1a2030;--tx:#e9edf6;--mu:#9aa4b8;--bd:#2a3248;--study:#7b9bff;--fun:#ff6b9d;--other:#3dd6a3;--soft:#141a27;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f131b;--card:#1a2030;--tx:#e9edf6;--mu:#9aa4b8;--bd:#2a3248;--study:#7b9bff;--fun:#ff6b9d;--other:#3dd6a3;--soft:#141a27;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;line-height:1.5}
main{max-width:520px;margin:0 auto;padding:16px 16px 40px}
h1{font-size:20px;margin:4px 0 14px}
h2{font-size:15px;margin:0 0 10px;color:var(--mu);font-weight:600}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin-bottom:14px}
#now{text-align:center;padding:20px 16px}
#nowlabel{color:var(--mu);font-size:15px;min-height:24px}
#clock{font-size:52px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:1px;margin:2px 0}
#now.on{border-width:2px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.act{border:2px solid var(--bd);background:var(--soft);color:var(--tx);border-radius:14px;padding:14px 8px;font:inherit;font-size:16px;cursor:pointer;text-align:center;min-height:84px}
.act:focus-visible,.del:focus-visible,input:focus-visible{outline:3px solid var(--study);outline-offset:2px}
.act b{display:block;font-size:26px;font-weight:400;line-height:1.2}
.act small{display:block;color:var(--mu);font-size:13px;margin-top:2px}
.act.study{border-color:color-mix(in srgb,var(--study) 40%,var(--bd))}
.act.fun{border-color:color-mix(in srgb,var(--fun) 40%,var(--bd))}
.act.other{border-color:color-mix(in srgb,var(--other) 40%,var(--bd))}
.act.run{color:#fff}
.act.run small{color:#fff}
.act.run.study{background:var(--study);border-color:var(--study)}
.act.run.fun{background:var(--fun);border-color:var(--fun)}
.act.run.other{background:var(--other);border-color:var(--other)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0}
.big{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.bar{height:10px;border-radius:6px;background:var(--soft);border:1px solid var(--bd);overflow:hidden;margin:6px 0 4px}
.bar i{display:block;height:100%;background:var(--fun);width:0}
.msg{font-size:14px;color:var(--mu)}
.msg.over{color:var(--fun);font-weight:600}
.lim{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:14px;color:var(--mu)}
.lim input{width:70px;font:inherit;padding:6px 8px;border:1px solid var(--bd);border-radius:8px;background:var(--soft);color:var(--tx)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.rec{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 0;border-top:1px solid var(--bd);font-size:15px}
.rec:first-of-type{border-top:0}
.rec span.t{color:var(--mu);font-size:13px;font-variant-numeric:tabular-nums}
.del{border:0;background:none;color:var(--mu);font-size:18px;padding:6px 10px;cursor:pointer;border-radius:8px}
.empty{color:var(--mu);font-size:14px;padding:4px 0}
</style>
</head>
<body>
<main>
  <h1>今天的時間記錄</h1>

  <section class="card" id="now">
    <div id="nowlabel">還沒開始記錄，點下面的活動開始</div>
    <div id="clock">00:00:00</div>
  </section>

  <section class="card">
    <h2>點一下開始，再點一下結束</h2>
    <div class="grid" id="acts"></div>
  </section>

  <section class="card">
    <h2>今天合計</h2>
    <div class="row"><span><span class="dot" style="background:var(--study)"></span>學習</span><span class="big" id="tStudy">0 分</span></div>
    <div class="row"><span><span class="dot" style="background:var(--fun)"></span>娛樂</span><span class="big" id="tFun">0 分</span></div>
    <div class="bar"><i id="funbar"></i></div>
    <div class="msg" id="funmsg"></div>
    <div class="lim"><label for="lim">今日娛樂上限</label><input id="lim" type="number" min="0" max="600" step="5" inputmode="numeric"> 分鐘</div>
  </section>

  <section class="card">
    <h2>今天的紀錄</h2>
    <div id="list"></div>
  </section>
</main>

<script>
const ACTS=[
  {id:"hw",name:"寫作業",e:"✏️",type:"study"},
  {id:"read",name:"讀書複習",e:"📖",type:"study"},
  {id:"video",name:"看影片",e:"📺",type:"fun"},
  {id:"game",name:"玩小遊戲",e:"🎮",type:"fun"},
  {id:"sport",name:"運動",e:"🏃",type:"other"},
  {id:"other",name:"其他",e:"🧩",type:"other"}
];
const KEY="timetracker-v1";
let S={recs:[],run:null,limit:60};
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r));}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
const $=id=>document.getElementById(id);
const byId=id=>ACTS.find(a=>a.id===id)||ACTS[5];
const p2=n=>String(n).padStart(2,"0");
function clock(ms){const s=Math.floor(ms/1000);return p2(Math.floor(s/3600))+":"+p2(Math.floor(s%3600/60))+":"+p2(s%60);}
function mins(ms){const m=Math.round(ms/60000);return m>=60?Math.floor(m/60)+" 小時 "+(m%60)+" 分":m+" 分";}
function hm(t){const d=new Date(t);return p2(d.getHours())+":"+p2(d.getMinutes());}
function dayStart(){const d=new Date();d.setHours(0,0,0,0);return d.getTime();}

function toggle(id){
  const now=Date.now();
  if(S.run){S.recs.push({act:S.run.act,start:S.run.start,end:now});const same=S.run.act===id;S.run=null;if(same){save();draw();return;}}
  S.run={act:id,start:now};save();draw();
}
function del(i){S.recs.splice(i,1);save();draw();}

function drawActs(){
  $("acts").innerHTML=ACTS.map(a=>{
    const on=S.run&&S.run.act===a.id;
    return '<button class="act '+a.type+(on?" run":"")+'" data-id="'+a.id+'"><b>'+a.e+'</b>'+a.name+'<small>'+(on?"記錄中，點一下結束":"點一下開始")+'</small></button>';
  }).join("");
}
function drawList(){
  const t0=dayStart();
  const items=S.recs.map((r,i)=>({r,i})).filter(x=>x.r.start>=t0).reverse();
  $("list").innerHTML=items.length?items.map(x=>{
    const a=byId(x.r.act);
    return '<div class="rec"><div><span class="dot" style="background:var(--'+a.type+')"></span>'+a.e+" "+a.name+'<br><span class="t">'+hm(x.r.start)+" – "+hm(x.r.end)+"，共 "+mins(x.r.end-x.r.start)+'</span></div><button class="del" data-del="'+x.i+'" aria-label="刪除這筆紀錄">✕</button></div>';
  }).join(""):'<div class="empty">今天還沒有紀錄。開始第一個活動吧。</div>';
}
function tick(){
  const now=Date.now(),t0=dayStart();
  let study=0,fun=0;
  S.recs.forEach(r=>{if(r.start<t0)return;const d=r.end-r.start,ty=byId(r.act).type;if(ty==="study")study+=d;if(ty==="fun")fun+=d;});
  if(S.run){
    const a=byId(S.run.act),d=now-S.run.start;
    if(a.type==="study")study+=d;if(a.type==="fun")fun+=d;
    $("nowlabel").textContent=a.e+" "+a.name+" 進行中";
    $("clock").textContent=clock(d);
    $("now").classList.add("on");$("now").style.borderColor="var(--"+a.type+")";
  }else{
    $("nowlabel").textContent="目前沒有在記錄，點下面的活動開始";
    $("clock").textContent="00:00:00";
    $("now").classList.remove("on");$("now").style.borderColor="";
  }
  $("tStudy").textContent=mins(study);
  $("tFun").textContent=mins(fun);
  const lim=S.limit*60000,pct=lim>0?Math.min(100,fun/lim*100):(fun>0?100:0);
  $("funbar").style.width=pct+"%";
  const over=lim>0?fun>lim:fun>0;
  $("funmsg").textContent=lim===0?"已設定為不玩娛樂":(over?"已超過今日娛樂上限，該去做別的事了":"還剩 "+mins(lim-fun)+" 的娛樂時間");
  $("funmsg").className="msg"+(over?" over":"");
}
function draw(){drawActs();drawList();tick();}

$("acts").addEventListener("click",e=>{const b=e.target.closest("[data-id]");if(b)toggle(b.dataset.id);});
$("list").addEventListener("click",e=>{const b=e.target.closest("[data-del]");if(b)del(+b.dataset.del);});
$("lim").value=S.limit;
$("lim").addEventListener("input",e=>{const v=parseInt(e.target.value,10);S.limit=isNaN(v)?0:Math.max(0,v);save();tick();});
draw();
setInterval(tick,1000);
</script>
</body>
</html>
